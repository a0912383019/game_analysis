# namespace 預設 default
namespace: cdp-web
replicaCount: 1
nodePool: web

# deployment 設定
deployment:
  # 服務的名稱(必填)
  appName: dev-game-frontend
  appVersion: game
  container:
    containerPort: 80
  resources:
    request:
      memory: "250Mi"
      cpu: "50m"
    limits:
      memory: "500Mi"
      cpu: "100m"

# service 設定
service:
  name: cdp-inner-service